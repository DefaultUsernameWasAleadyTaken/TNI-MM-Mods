name: Sync toolkit and examples

on:
  schedule:
    # Ежедневно в 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync toolkit and examples
        run: bash scripts/sync-all.sh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync toolkit (official kit) + examples (community)"
          branch: chore/sync-sources
          delete-branch: true
          title: "chore: sync toolkit + community examples"
          body: |
            Автоматическая синхронизация:

            - `toolkit/` ← [treefarmer741/Tower-Networking-Inc-modding-kit](https://github.com/treefarmer741/Tower-Networking-Inc-modding-kit) (официальный kit)
            - `examples/` ← `mods/` из [CJFWeatherhead/TNI-Mods](https://github.com/CJFWeatherhead/TNI-Mods) (community)

            Корневые `mods/` (ваши моды) не затрагиваются.

            SHA: `toolkit/.upstream-sha`, `examples/.upstream-sha`
          base: main
          labels: toolkit, examples, automated
